global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 5s
scrape_configs:
  - job_name: mcp-tunnels
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:8080
        labels: {mcp: terminal}
      - targets: [127.0.0.1:8081]
        labels: {mcp: playwright}
      - targets: [127.0.0.1:8082]
        labels: {mcp: computer}
      - targets: [127.0.0.1:8083]
        labels: {mcp: personal}
      - targets: [127.0.0.1:8084]
        labels: {mcp: excel}
      - targets: [127.0.0.1:8085]
        labels: {mcp: background}
  - job_name: mcp-observer-v2
    static_configs:
      - targets: [127.0.0.1:9120]
