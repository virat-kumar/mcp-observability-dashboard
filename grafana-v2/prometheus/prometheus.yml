global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 5s
scrape_configs:
  - job_name: mcp-tunnels
    metrics_path: /metrics
    static_configs:
      - targets: [127.0.0.1:18880]
        labels: {mcp: terminal}
      - targets: [127.0.0.1:8081]
        labels: {mcp: playwright}
      - targets: [127.0.0.1:8082]
        labels: {mcp: computer}
      - targets: [127.0.0.1:8083]
        labels: {mcp: personal}
      - targets: [127.0.0.1:8084]
        labels: {mcp: excel}
      - targets: [127.0.0.1:8085]
        labels: {mcp: background}
      - targets: [127.0.0.1:18951]
        labels: {mcp: desktop_live}
      - targets: [127.0.0.1:18952]
        labels: {mcp: chrome_live}
      - targets: [127.0.0.1:18960]
        labels: {mcp: plans}
      - targets: [127.0.0.1:18964]
        labels: {mcp: jupyter}
      - targets: [127.0.0.1:8965]
        labels: {mcp: file_share}
      - targets: [127.0.0.1:19244]
        labels: {mcp: craft_anything}
  - job_name: mcp-observer-v2
    static_configs:
      - targets: [127.0.0.1:9120]

  - job_name: n8n-private
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: [127.0.0.1:5678]
        labels: {app: n8n, visibility: localhost}
